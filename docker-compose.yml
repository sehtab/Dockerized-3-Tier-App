version: '3.8'

services:
  # Tier 3: Data Tier
  db:
    image: postgres:16-alpine
    container_name: app_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: myapp
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network

  # Tier 2: Backend Tier
  backend:
    build: ./backend
    container_name: app_backend
    restart: always
    environment:
      DB_HOST: db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: myapp
    depends_on:
      - db
    networks:
      - app-network

  # Tier 1: Frontend Tier
  frontend:
    build: ./frontend
    container_name: app_frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
